 <html lang="nl">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Producten & Collecties</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
            <style>
                body {background:#f6f7f9; }
                .prop-row {gap:.5rem; margin-bottom:.5rem; }
                .logbox {font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
              white-space:pre-line; max-height:200px; overflow:auto; background:#0f1620; color:#e8eef5; border-radius:.5rem; }
                .collection-item.active {background:#eef7ff; }
                 .navbar-brand {text-decoration: underline; text-decoration-color: red; text-decoration-thickness: 3px}
            </style>
        </head>
        <body>
           <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
                <div class="container">
                    <a class="navbar-brand fw-semibold text-primary" href="/">Daf-AI</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div id="nav" class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a href="/" class="nav-link">Live Viewer</a></li>
                            <li class="nav-item"><a href="/products-ui" class="nav-link">products</a></li>
                            <li class="nav-item"><a href="/trainer" class="nav-link">Trainer</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <main class="container my-4">
                <div class="row g-4">
                    <aside class="col-12 col-lg-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h2 class="h6 m-0">Collecties</h2>
                                    <button id="newCollection" class="btn btn-sm btn-primary">+ Voeg collectie toe</button>
                                </div>
                                <div id="collections" class="list-group"></div>
                            </div>
                        </div>
                        <div class="card shadow-sm mt-3">
                            <div class="card-body">
                                <label class="form-label fw-semibold">Log</label>
                                <div id="log" class="logbox p-2">Klaar.</div>
                                <button id="clearLog" class="btn btn-sm btn-outline-secondary mt-2">Leeg log</button>
                            </div>
                        </div>
                    </aside>

                    <section class="col-12 col-lg-9">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h1 class="h4" id="currentCollectionName">Alle producten</h1>
                                <div class="text-muted" id="collectionHint">Selecteer links een collectie om te filteren.</div>
                            </div>
                            <div class="d-flex gap-2 invisible">
                                <button id="reloadBtn" class="btn btn-outline-secondary btn-sm">Reload</button>
                                <button id="newProduct" class="btn btn-success btn-sm">+ Nieuw product</button>
                            </div>
                        </div>

                        <div class="card shadow-sm mb-3">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-12 col-md-4">
                                        <label class="form-label fw-semibold">Naam</label>
                                        <input id="pName" class="form-control" placeholder="bv. Flens" />
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label fw-semibold">Collectie</label>
                                        <select id="pCollection" class="form-select"></select>
                                    </div>
                                </div>

                                <div class="mt-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label fw-semibold m-0">Eigenschappen</label>
                                        <button id="addProp" class="btn btn-sm btn-outline-primary">+ Eigenschap</button>
                                    </div>
                                    <div id="propList"></div>
                                </div>

                                <div class="mt-3 d-flex gap-2">
                                    <button id="saveBtn" class="btn btn-primary">Opslaan</button>
                                    <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
                                </div>
                            </div>
                        </div>

                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table id="grid" class="table table-sm align-middle">
                                        <thead></thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </section>
                </div>
            </main>

                       <script>
    document.querySelectorAll('.nav-link').forEach(a=>{
      if (a.getAttribute('href') === window.location.pathname) a.classList.add('active');
    });
            </script>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
            <script src="/static/products.js"></script>
        </body>
    </html>
