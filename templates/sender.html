<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone Sender</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 12px
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            height: 20rem
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            margin-top: 12px
        }

        #status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 8px;
            background: #f6f6f6
        }

        .ok {
            color: #0a7d00
        }

        .warn {
            color: #8a6d00
        }

        .err {
            color: #a10000
        }
    </style>
</head>

<body>
    <h2>Phone Camera</h2>

    <video id="preview" autoplay playsinline muted></video>

    <div>
        <button id="reqBtn">Request camera</button>
        <button id="startBtn">Start stream to server</button>
        <button id="snapBtn">Neem foto & stuur naar Trainer</button>
    </div>
    <div id="status">Initializing…</div>
    <!-- onzichtbaar canvas om een frame te encoden -->
    <canvas id="snapCanvas" style="display:none;"></canvas>

    <script>
        const statusEl = document.getElementById('status');
        const reqBtn = document.getElementById('reqBtn');
        const startBtn = document.getElementById('startBtn');
        const snapBtn = document.getElementById('snapBtn');
        const videoEl = document.getElementById('preview');
        const snapCanvas = document.getElementById('snapCanvas');

        let localStream = null;
        let pc = null;

        function log(msg, cls = '') { statusEl.innerHTML = `<div class="${cls}">${msg}</div>` + statusEl.innerHTML; console.log(msg); }
        function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

        async function diagnostics() {
            log(`UserAgent: ${navigator.userAgent}`);
            log(`isSecureContext: ${window.isSecureContext}`, window.isSecureContext ? 'ok' : 'warn');
            if (!navigator.mediaDevices?.getUserMedia) {
                log('getUserMedia niet beschikbaar.', 'err'); return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter(d => d.kind === 'videoinput');
                log(`Gevonden ${cams.length} camera('s).`, cams.length ? 'ok' : 'warn');
            } catch (e) { log(`enumerateDevices: ${e.message}`, 'warn'); }
            if (!window.isSecureContext && isIOS()) {
                log('iOS vereist doorgaans HTTPS voor camera.', 'warn');
            }
        }

        async function getCameraStream() {
            const tries = [
                { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: true, audio: false }
            ];
            let lastErr = null;
            for (const c of tries) {
                try { return await navigator.mediaDevices.getUserMedia(c); }
                catch (e) { lastErr = e; log(`getUserMedia fail: ${e.name} - ${e.message}`, 'warn'); }
            }
            throw lastErr || new Error('getUserMedia failed');
        }
        function showStream(stream) { localStream = stream; videoEl.srcObject = stream; log('Camera OK, preview gestart.', 'ok'); }

        async function requestCamera() {
            try { const s = await getCameraStream(); showStream(s); }
            catch (e) {
                let hint = ''; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') hint = ' (site-permissies voor Camera toestaan)';
                log(`Camera error: ${e.name} - ${e.message}${hint}`, 'err'); alert(`Camera error: ${e.name}\n${e.message}\n${hint}`);
            }
        }

        async function startStreaming() {
            if (!localStream) { await requestCamera(); if (!localStream) { log('Geen camera-stream.', 'err'); return; } }
            startBtn.disabled = true;
            try {
                pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] });
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
                const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
                const resp = await fetch("/offer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
                if (!resp.ok) { throw new Error(`Server /offer: ${resp.status} ${await resp.text()}`); }
                const answer = await resp.json(); await pc.setRemoteDescription(answer);
                log('Streaming gestart naar server.', 'ok');
            } catch (e) { startBtn.disabled = false; log(`Stream start error: ${e.message}`, 'err'); alert(e.message); }
        }

        // ======= NIEUW: Foto nemen en uploaden naar /api/trainer/upload-image =======
        async function snapAndSend() {
            if (!localStream) { await requestCamera(); if (!localStream) { return; } }

            const track = localStream.getVideoTracks()[0];
            const settings = track.getSettings ? track.getSettings() : {};
            const w = settings.width || videoEl.videoWidth || 1280;
            const h = settings.height || videoEl.videoHeight || 720;

            snapCanvas.width = w; snapCanvas.height = h;
            const ctx = snapCanvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, w, h);

            const blob = await new Promise(res => snapCanvas.toBlob(res, "image/jpeg", 0.95));
            if (!blob) { log('Kon geen JPEG maken.', 'err'); return; }

            const fd = new FormData();
            const fname = `phone_${Date.now()}.jpg`;
            fd.append('file', new File([blob], fname, { type: "image/jpeg" }));
            fd.append('name', fname);

            try {
                const r = await fetch('/api/trainer/upload-image', { method: 'POST', body: fd });
                const data = await r.json();
                if (!r.ok) { throw new Error(data?.error || `HTTP ${r.status}`); }
                log(`Foto verstuurd → ${data.url}`, 'ok');
            } catch (e) {
                log(`Upload mislukt: ${e.message}`, 'err');
                alert(`Upload mislukt: ${e.message}`);
            }
        }

        reqBtn.onclick = requestCamera;
        startBtn.onclick = startStreaming;
        snapBtn.onclick = snapAndSend;

        window.addEventListener('load', async () => { await diagnostics(); await requestCamera(); });
    </script>
</body>

</html>
